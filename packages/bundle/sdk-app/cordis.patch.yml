# The SDK application over dsh-base. Stdout belongs exclusively to JSON-RPC.

- id: system-prompt
  config:
    personaPrefix: >-
      You are a coding agent powered by the {{model}} model.

- id: session-title-llm
  disabled: true

- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: sdk

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: !!js "process.env.DSH_MAX_TOKENS_AS_SUCCESS === undefined ? true : JSON.parse(process.env.DSH_MAX_TOKENS_AS_SUCCESS)"

- id: hmr
  disabled: true

- id: tool-plugin-manager
  disabled: false

- insert:
    - id: connection
      name: '@deepseek-ai/dsh-client-connection'

    - id: file-upload
      name: '@deepseek-ai/dsh-client-file-upload'

    - id: workspace
      name: '@deepseek-ai/dsh-workspace'

    - id: schedule
      name: '@deepseek-ai/dsh-schedule'
      inject: [sdkSessionActivation]

    - id: time-context
      name: '@deepseek-ai/dsh-time-context'

    - id: tool-schedule
      name: '@deepseek-ai/dsh-tool-schedule'

    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

    - id: present
      name: '@deepseek-ai/dsh-tool-present'

    - id: file-reference-local
      name: '@deepseek-ai/dsh-file-reference-local'

    - id: deliverable-file-references
      name: '@deepseek-ai/dsh-deliverable-file-references'
